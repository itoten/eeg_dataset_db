D.forEach(d => {
  const g = d.groups.find(x => x.group_id === "all") || (d.groups.length === 1 ? d.groups[0] : null);
  d._parent = d.rel.filter(r => r[0] === "subset_of").map(r => r[1]);
  d._g = g;
});

(() => { const svg = document.getElementById("trace"); let p = "";
  for (let x = 0; x <= 1000; x += 2) { const t = x / 1000 * 12; const y = 22 + 8 * Math.sin(t * 6.2) * Math.sin(t * 0.7 + 1) + 3 * Math.sin(t * 23 + 0.4) + 2 * Math.sin(t * 41);
    p += (x ? " L" : "M") + x + " " + y.toFixed(1); }
  svg.innerHTML = `<path d="${p}" fill="none" stroke="var(--trace)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>`; })();

const state = { q: "", tier: null, repo: "", mod: "", par: "", dom: "", lic: "", sort: ["subj", -1], shown: 100, open: null };
const tierCount = {}; D.forEach(d => tierCount[d.tier] = (tierCount[d.tier] || 0) + 1);
const tally = f => { const c = {}; D.forEach(d => f(d).forEach(v => c[v] = (c[v] || 0) + 1)); return Object.entries(c).sort((a, b) => b[1] - a[1]); };
const TALLY = { "f-repo": tally(d => [d.repo]), "f-mod": tally(d => semi(d.mod)), "f-par": tally(d => semi(d.par)), "f-dom": tally(d => semi(d.dom)), "f-lic": tally(d => [d.lic || ""]) };

const ageSex = g => { if (!g) return ""; const t = T().f; const a = [];
  if (g.age_min && g.age_max) a.push(`${g.age_min}–${g.age_max}`); if (g.age_mean) a.push(`${t.mean} ${g.age_mean}`);
  const s = [g.n_female ? `${t.female} ${g.n_female}` : "", g.n_male ? `${t.male} ${g.n_male}` : ""].filter(Boolean).join(" / ");
  return [a.join(", "), s].filter(Boolean).join(" · "); };
const COLS = [
  { k: "name", g: "id", cls: "", v: d => `<div class="nm">${esc(d.name || d.id)}</div><div class="sub mono">${esc(d.id)}</div>`, s: d => (d.name || "").toLowerCase() },
  { k: "repo", g: "id", cls: "", v: d => esc(d.repo), s: d => d.repo },
  { k: "mod", g: "id", cls: "", v: d => semi(d.mod).map(m => `<span class="tag">${esc(m)}</span>`).join("") || dash, s: d => d.mod },
  { k: "dom", g: "id", cls: "", v: d => semi(d.dom).map(m => `<span class="tag">${esc(m)}</span>`).join("") || dash, s: d => d.dom },
  { k: "year", g: "id", cls: "num", v: d => esc(d.year) || dash, s: d => num(d.year) },
  { k: "subj", g: "rec", cls: "num", v: d => esc(d.subj) || dash, s: d => num(d.subj) },
  { k: "sess", g: "rec", cls: "num", v: d => esc(d.sess) || dash, s: d => num(d.sess) },
  { k: "rec", g: "rec", cls: "num", v: d => esc(d.rec) || dash, s: d => num(d.rec) },
  { k: "hours", g: "rec", cls: "num", v: d => esc(d.hours) || dash, s: d => num(d.hours) },
  { k: "gb", g: "rec", cls: "num", v: d => esc(d.gb) || dash, s: d => num(d.gb) },
  { k: "nch", g: "setup", cls: "num", v: d => esc(semi(d.nch).join(", ")) || dash, s: d => num(semi(d.nch).pop()) },
  { k: "mont", g: "setup", cls: "mono", v: d => esc(semi(d.mont).join(", ")) || dash, s: d => d.mont },
  { k: "fs", g: "setup", cls: "num", v: d => esc(semi(d.fs).join(", ")) || dash, s: d => num(semi(d.fs).pop()) },
  { k: "dev", g: "setup", cls: "wrapc", v: d => esc(semi(d.dev).join("; ")) || dash, s: d => (d.dev || "").toLowerCase() },
  { k: "tasks", g: "task", cls: "wrapc", v: d => { const p = semi(d.par).map(x => `<span class="tag">${esc(x)}</span>`).join("");
      const n = d.tasks.map(t => t[1]).slice(0, 4).join(", ") + (d.tasks.length > 4 ? ` +${d.tasks.length - 4}` : "");
      return (p + (n ? `<div class="sub">${esc(n)}</div>` : "")) || dash; }, s: d => d.tasks.length },
  { k: "age", g: "people", cls: "wrapc", v: d => esc(ageSex(d._g)) || dash, s: d => num(d._g && (d._g.age_mean || d._g.age_min)) },
  { k: "pf", g: "people", cls: "wrapc", v: d => d.pf.length ? `<span class="sub">${esc(T().n_items(d.pf.length))}</span> ${[...new Set(d.pf.map(p => p[1]).filter(c => c !== "other"))].map(c => `<span class="tag">${esc(c)}</span>`).join("")}` : dash, s: d => d.pf.length },
  { k: "qual", g: "qual", cls: "wrapc", v: d => d.qual.length ? [...new Set(d.qual.map(q => q[0]))].map(c => `<span class="tag">${esc(c)}</span>`).join("") : dash, s: d => d.qual.length },
  { k: "parent", g: "qual", cls: "mono", v: d => d._parent.map(p => esc((byId[p] || {}).name || p)).join(", ") || dash, s: d => d._parent.join() },
  { k: "lic", g: "rights", cls: "mono", v: d => esc(d.lic) || dash, s: d => d.lic },
  { k: "com", g: "rights", cls: "mono", v: d => esc(d.terms[1]) || dash, s: d => d.terms[1] },
  { k: "tier", g: "rights", cls: "", v: d => `<span class="pill"><span class="dot" style="background:${TCOL[d.tier] || TCOL[""]}"></span>${esc((T().tiers[d.tier] || T().tiers[""])[0])}</span>`,
    s: d => TIERS.findIndex(t => t[0] === d.tier) },
];

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { const v = T()[el.dataset.i]; if (el.dataset.html) el.innerHTML = v; else el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("meta").textContent = T().meta(D.length, S.length, DATA.meta.built, DATA.meta.commit);
  document.getElementById("q").placeholder = T().search;
  const opts = (id, label) => { const el = document.getElementById(id); const cur = el.value;
    el.innerHTML = `<option value="">${esc(label)}</option>` + TALLY[id].map(([v, n]) => `<option value="${esc(v)}">${esc(v || T().not_checked)} (${n})</option>`).join(""); el.value = cur; };
  opts("f-repo", T().all_repo); opts("f-mod", T().all_mod); opts("f-par", T().all_par); opts("f-dom", T().all_dom); opts("f-lic", T().all_lic);
  document.getElementById("bar").innerHTML = TIERS.filter(t => tierCount[t[0]]).map(t =>
    `<span style="width:${100 * tierCount[t[0]] / D.length}%;background:${t[1]}" title="${esc(T().tiers[t[0]][0])}: ${tierCount[t[0]]}"></span>`).join("");
  document.getElementById("legend").innerHTML = TIERS.filter(t => tierCount[t[0]]).map(t =>
    `<button type="button" data-t="${t[0]}" aria-pressed="${state.tier === t[0]}" title="${esc(T().tiers[t[0]][1])}"><span class="dot" style="background:${t[1]}"></span>${esc(T().tiers[t[0]][0])} <span class="n">${tierCount[t[0]]}</span></button>`).join("");
  const groups = []; COLS.forEach(c => { const last = groups[groups.length - 1]; if (last && last[0] === c.g) last[1]++; else groups.push([c.g, 1]); });
  document.getElementById("thead").innerHTML = `<tr>${groups.map(([g, n]) => `<th class="grp" colspan="${n}">${esc(T().groups[g])}</th>`).join("")}</tr>
    <tr class="cols">${COLS.map(c => `<th data-k="${c.k}" tabindex="0">${esc(T().cols[c.k])}</th>`).join("")}</tr>`;
  render();
  if (state.open) openD(state.open);
}
document.querySelector(".lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem("lang", lang); } catch (err) {} applyLang(); });

document.getElementById("legend").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  state.tier = state.tier === b.dataset.t ? null : b.dataset.t;
  document.querySelectorAll("#legend button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.t === state.tier)));
  state.shown = 100; render(); });
const bind = (id, key) => document.getElementById(id).addEventListener("input", e => { state[key] = e.target.value; state.shown = 100; render(); });
bind("q", "q"); bind("f-repo", "repo"); bind("f-mod", "mod"); bind("f-par", "par"); bind("f-dom", "dom"); bind("f-lic", "lic");
const sortBy = k => { const textual = ["name", "repo", "mod", "dom", "mont", "dev", "parent", "lic", "com"].includes(k);
  state.sort = [k, state.sort[0] === k ? -state.sort[1] : (textual ? 1 : -1)]; render(); };
document.getElementById("thead").addEventListener("click", e => { const th = e.target.closest("th[data-k]"); if (th) sortBy(th.dataset.k); });
document.getElementById("thead").addEventListener("keydown", e => { const th = e.target.closest("th[data-k]"); if (th && e.key === "Enter") sortBy(th.dataset.k); });
document.getElementById("more-b").addEventListener("click", () => { state.shown += 200; render(); });

const hay = d => (d._hay ??= [d.id, d.name, d.full, d.dev, d.mod, d.dom, d.par, d.repo, d.tasks.map(t => t[1]).join(" "), d.alias.map(a => a[0]).join(" ")].join(" ").toLowerCase());
function render() {
  const q = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = D.filter(d => (state.tier === null || d.tier === state.tier) && (!state.repo || d.repo === state.repo)
    && (!state.mod || semi(d.mod).includes(state.mod)) && (!state.par || semi(d.par).includes(state.par)) && (!state.dom || semi(d.dom).includes(state.dom))
    && (!state.lic || (d.lic || "") === state.lic) && q.every(w => hay(d).includes(w)));
  const [k, dir] = state.sort; const col = COLS.find(c => c.k === k);
  list.sort((a, b) => { const x = col.s(a), y = col.s(b);
    const ex = x === null || x === "" || x === undefined, ey = y === null || y === "" || y === undefined;
    if (ex && ey) return 0; if (ex) return 1; if (ey) return -1; return x < y ? -dir : x > y ? dir : 0; });
  document.querySelectorAll("th[data-k]").forEach(th => th.setAttribute("aria-sort", th.dataset.k === k ? (dir > 0 ? "ascending" : "descending") : "none"));
  document.getElementById("count").textContent = T().count(list.length, D.length);
  document.getElementById("rows").innerHTML = list.slice(0, state.shown).map(d =>
    `<tr tabindex="0" data-id="${esc(d.id)}">${COLS.map(c => `<td class="${c.cls}">${c.v(d)}</td>`).join("")}</tr>`).join("");
  document.getElementById("more").hidden = list.length <= state.shown;
}
const rowsEl = document.getElementById("rows");
rowsEl.addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) openD(tr.dataset.id); });
rowsEl.addEventListener("keydown", e => { if (e.key === "Enter") { const tr = e.target.closest("tr"); if (tr) openD(tr.dataset.id); } });

const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
const srcLink = i => { if (i < 0 || !S[i]) return ""; const [id, url, title, kind, type] = S[i];
  return (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(title || id)}</a>` : esc(title || id)) + ` <span class="sub">${esc(kind)}${type ? " · " + esc(type) : ""}</span>`; };
const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${v}</dd>` : "";
function openD(id) {
  const d = byId[id]; if (!d) return; state.open = id;
  const t = T(), f = t.f, tier = t.tiers[d.tier] || t.tiers[""];
  const terms = [f.ml, f.com, f.der].map((n, i) => d.terms[i] ? `${esc(n)}: <span class="mono">${esc(d.terms[i])}</span>` : "").filter(Boolean).join(" · ");
  const sec = (title, body) => body ? `<section class="panel"><h2>${esc(title)}</h2>${body}</section>` : "";
  const routes = d.routes.map(r => `<dl>${row(f.route, `<span class="mono">${esc(r[0])}</span> (${esc(r[1])})`)}${row(f.link, r[2] ? `<a href="${esc(r[2])}" target="_blank" rel="noopener">${esc(r[2])}</a>` : "")}
    ${row(f.steps, esc(r[4] === "none" ? f.nothing : r[4]))}${row(f.meth, esc(t.method[r[3]] || r[3]))}${row(f.tools, esc(semi(r[5]).join(", ")))}${row(f.tried, esc(r[6]))}</dl>`).join("");
  const setups = d.setups.map(s => `<dl>${row(f.setup, `<span class="mono">${esc(s.setup_id)}</span>`)}${row(f.scope, esc(s.description))}
    ${row(f.dev, esc([s.device_manufacturer, s.device_model].filter(Boolean).join(" ")))}${row(f.nch, esc(s.n_channels_eeg))}
    ${row(f.other, esc([s.n_channels_other, s.other_channel_types].filter(Boolean).join(" · ")))}${row(f.place, esc(s.montage_system))}
    ${row(f.ref, esc(s.reference))}${row(f.gnd, esc(s.ground))}${row(f.fs, s.sampling_rate_hz ? esc(s.sampling_rate_hz) + " Hz" : "")}
    ${row(f.line, s.line_freq_hz ? esc(s.line_freq_hz) + " Hz" : "")}${row(f.elec, esc(s.electrode_type))}${row(f.hw, esc(s.hardware_filter))}
    ${row(f.chn, d.ch[s.setup_id] ? `<div class="chips">${d.ch[s.setup_id].map(c => `<span class="chip" title="${esc(c[1])}">${esc(c[0])}</span>`).join("")}</div><div class="note">${esc(t.ch_note)}</div>` : "")}</dl>`).join("");
  const groups = d.groups.map(g => `<dl>${row(f.group, esc(g.group_label))}${row(f.subj, esc(g.n_subjects))}${row(f.cond, esc(g.condition))}${row(f.diag, esc(g.diagnosis))}
    ${row(f.age, esc([g.age_min && g.age_max ? `${g.age_min}–${g.age_max}` : "", g.age_mean ? `${f.mean} ${g.age_mean}` : "", g.age_sd ? `${f.sd} ${g.age_sd}` : ""].filter(Boolean).join(", ")))}
    ${row(f.sex, esc([g.n_female ? `${f.female} ${g.n_female}` : "", g.n_male ? `${f.male} ${g.n_male}` : ""].filter(Boolean).join(", ")))}${row(f.hand, esc(g.handedness))}${row(f.prior, esc(g.prior_experience))}</dl>`).join("");
  const pf = d.pf.length ? `<div class="inner"><table class="ev"><tbody>${d.pf.map(p => `<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td><td>${esc(p[2])}${p[3] ? ` <span class="sub">(${esc(p[3])})</span>` : ""}</td></tr>`).join("")}</tbody></table></div><div class="note">${esc(t.pf_note)}</div>` : "";
  const tasks = d.tasks.map(x => `<div><span class="mono">${esc(x[0])}</span> · ${esc(x[1])}${x[2] ? ` <span class="tag">${esc(x[2])}</span>` : ""}</div>`).join("");
  const ann = d.ann.map(a => `<div><b>${esc(a[1])}</b> <span class="tag">${esc(a[0])}</span>${a[2] ? ` — ${esc(semi(a[2]).join(", "))}` : ""}</div>`).join("");
  const qual = d.qual.map(q => `<div><span class="tag">${esc(q[0])}</span> ${esc(q[1])}<div class="sub">${srcLink(q[3])}</div></div>`).join("");
  const iss = d.iss.map(x => `<div><span class="tag">${esc(x[0])}</span> ${esc(x[1])}</div>`).join("");
  const rel = d.rel.map(r => `<div>${lang === "ja" ? `<a href="#${esc(r[1])}" data-open="${esc(r[1])}">${esc((byId[r[1]] || {}).name || r[1])}</a> ${esc(t.rel[r[0]] || r[0])}` : `${esc(t.rel[r[0]] || r[0])} <a href="#${esc(r[1])}" data-open="${esc(r[1])}">${esc((byId[r[1]] || {}).name || r[1])}</a>`}${r[2] ? `<div class="note">${esc(r[2])}</div>` : ""}</div>`).join("");
  const who = b => b === "claude" ? f.by_ai : b === "script" ? f.by_script : f.by_user;
  const ev = d.ev.length ? `<div class="inner"><table class="ev"><tbody>${d.ev.map(e => `<tr><td>${esc(e[0])}</td><td>${esc(e[1])}${e[6] === "conflicting" ? ` <span class="warn">${esc(t.conflicting)}</span>` : ""}<div class="sub">${srcLink(e[2])}${e[3] ? " — “" + esc(e[3]) + "”" : ""}</div><div class="sub">${esc(f.checked_on(e[4], who(e[5])))}</div></td></tr>`).join("")}</tbody></table></div>` : "";
  const docs = d.links.map(l => `<div><span class="tag">${esc(l[0])}</span> ${srcLink(l[1])}</div>`).join("");
  drawer.innerHTML = `<div class="dhead"><div><div class="sub mono">${esc(d.id)}</div><h3 id="d-title">${esc(d.name || d.id)}</h3>${d.full && d.full !== d.name ? `<div class="sub">${esc(d.full)}</div>` : ""}</div><button class="x" type="button" id="close">${esc(t.close)}</button></div>
    ${sec(t.sec.summary, `<dl>${row(f.access, `<span class="pill"><span class="dot" style="background:${TCOL[d.tier] || TCOL[""]}"></span>${esc(tier[0])}</span>${d.best ? ` <span class="sub">${esc(t.method[d.best] || d.best)}</span>` : ""}`)}
      ${row(f.repo, esc(d.repo))}${row(f.mod, esc(semi(d.mod).join(", ")))}${row(f.dom, esc(semi(d.dom).join(", ")))}${row(f.subj, esc(d.subj))}
      ${row(f.sess, esc(d.sess))}${row(f.rec, esc(d.rec))}${row(f.hours, esc(d.hours))}${row(f.gb, d.gb ? esc(d.gb) + " GB" : "")}
      ${row(f.nch, esc(semi(d.nch).join(", ")))}${row(f.fs, d.fs ? esc(semi(d.fs).join(", ")) + " Hz" : "")}${row(f.dev, esc(semi(d.dev).join("; ")))}
      ${row(f.par, esc(semi(d.par).join(", ")))}${row(f.year, esc(d.year))}${row(f.bids, esc(d.bids))}
      ${row(f.lic, `<span class="mono">${esc(d.lic)}</span>`)}${row(f.licn, esc(d.licn))}${row(f.terms, terms)}${row(f.termsn, esc(d.termsn))}
      ${row(f.checked, [d.doc ? f.prim : "", d.impl ? f.readme : ""].filter(Boolean).join(", "))}
      ${row(f.alias, esc(d.alias.map(a => a[0]).join(", ")))}${row(f.notes, esc(d.notes))}${row(f.upd, esc(d.upd))}</dl>`)}
    ${sec(t.sec.routes, routes)}${sec(t.sec.setup, setups)}${sec(t.sec.tasks, tasks)}${sec(t.sec.people, groups)}${sec(t.sec.pf, pf)}
    ${sec(t.sec.ann, ann)}${sec(t.sec.qual, qual)}${sec(t.sec.iss, iss)}${sec(t.sec.rel, rel)}${sec(t.sec.docs, docs)}${sec(t.sec.ev, ev)}`;
  if (drawer.hidden) { drawer.hidden = false; scrim.hidden = false; drawer.scrollTop = 0; document.getElementById("close").focus(); }
}
function closeD() { drawer.hidden = true; scrim.hidden = true; state.open = null; }
drawer.addEventListener("click", e => { if (e.target.id === "close") closeD(); const a = e.target.closest("[data-open]"); if (a) { e.preventDefault(); drawer.scrollTop = 0; openD(a.dataset.open); } });
scrim.addEventListener("click", closeD);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !drawer.hidden) closeD(); });

applyLang();
const h = decodeURIComponent(location.hash.slice(1)); if (h && byId[h]) openD(h);
})();
</script>
